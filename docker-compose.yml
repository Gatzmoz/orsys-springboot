services:
  db:
    container_name: gatzmoz-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatzmoz
      POSTGRES_PASSWORD: "Heavy Rotation"
      POSTGRES_DB: orsys
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    container_name: gatzmoz-backend
    build:
      context: ./backend/orsys
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/orsys
      SPRING_DATASOURCE_USERNAME: gatzmoz
      SPRING_DATASOURCE_PASSWORD: gatzmoz
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    container_name: gatzmoz-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
